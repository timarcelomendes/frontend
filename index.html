<!DOCTYPE html>
<html lang="pt-PT" class="antialiased" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nps.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPS INTELLIGENCE</title>

    <script>
      // Função para aplicar o tema baseado no sistema operativo
      function updateTheme() {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      updateTheme();

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>`
