server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte a SPA com vue-router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets estaticos versionados
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
